<script>
// v136: un solo numero di versione per tutta la pagina. Con &nc=... nell'indirizzo (lo mette "Aggiorna") ogni file si riscarica per forza.
window.ORDO_V = 160;
(function () {
  var q = new URLSearchParams(location.search), voluta = +q.get("v") || 0, nc = q.get("nc");
  // la pagina arrivata e' piu' vecchia di quella chiesta (cache del browser o del server): si ricarica una volta con un indirizzo nuovo
  try { if (voluta > window.ORDO_V && sessionStorage.getItem("ordo_rientro") !== String(voluta)) { sessionStorage.setItem("ordo_rientro", String(voluta)); q.set("nc", Date.now().toString(36)); location.replace(location.pathname + "?" + q.toString()); } } catch (e) {}
  window.ORDO_SUF = "?v=" + window.ORDO_V + (nc ? "&nc=" + encodeURIComponent(nc) : "");
  document.write('<link rel="stylesheet" href="stile.css' + window.ORDO_SUF + '"><link rel="stylesheet" href="ordo.css' + window.ORDO_SUF + '">');
})();
</script>
