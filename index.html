<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Re della Laguna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--oro:#f3c56b;--pulito:#5fd38d;--sporco:#ff6b6b;--setta:#b388ff;--rosa:#ff5fa2;--ink:#fff;--muted:rgba(255,255,255,.72);--vetro:rgba(10,16,26,.6);--bordo:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1018;color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow:hidden}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.kick{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.vetro{background:var(--vetro);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--bordo)}
button{font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:10px 16px;background:rgba(255,255,255,.08);color:#fff;font-weight:700}
button:hover{filter:brightness(1.12)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffe0a3;outline-offset:2px}
button.oro{background:var(--oro);color:#1a1205;border:0;font-weight:800}
button.bianco{background:#fff;color:#0b1018;border:0;font-weight:800}
button.grande{font-size:16px;padding:14px 22px}
button.piccolo{padding:6px 10px;font-size:13px;border-radius:9px}

input,select,textarea{font:inherit;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 11px}
select option{color:#0b1018}
label{font-size:13px;color:var(--muted)}
#scena{position:fixed;inset:0;background:#0b1018 center/cover no-repeat;transition:background-image .6s}

#radice{position:fixed;inset:0}
.alto{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:46%}
.chip{display:flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;border-radius:999px}
.pall{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0b1018;font-weight:800;font-size:12px;flex-shrink:0}
.chip .n{font-size:12px;font-weight:700;line-height:1.1}
.chip .s{font-size:11px;color:var(--muted)}
.chip.turno{outline:2px solid var(--oro)}
.fase{padding:9px 18px;border-radius:999px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;white-space:nowrap}
.saldo{width:240px;padding:12px 14px;border-radius:14px;display:flex;flex-direction:column;gap:6px}
.saldo .riga{display:flex;justify-content:space-between;align-items:baseline}
.mappa{position:absolute;left:16px;bottom:16px;width:300px;padding:8px;border-radius:16px}

.ped{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}

.dove{display:flex;justify-content:space-between;padding:7px 4px 1px;font-size:12px}
.decisione{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100vw - 680px));min-width:420px;padding:18px 20px;border-radius:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}

.riga{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.destra{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tel{position:absolute;right:16px;top:150px;bottom:84px;width:400px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.tel .tabs{display:flex;gap:4px;flex-wrap:wrap;padding:12px 12px 8px}

.tel .corpo{flex:1;overflow:auto;padding:4px 14px 14px;font-size:13px}
.it{padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.1)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:rgba(255,255,255,.12);margin-right:4px;font-weight:700}
.tag.scandalo{background:rgba(255,107,107,.25)}.tag.voce{background:rgba(243,197,107,.25)}.tag.borsa{background:rgba(79,195,247,.25)}.tag.politica{background:rgba(179,136,255,.25)}.tag.fama{background:rgba(243,197,107,.25)}
.velo{position:fixed;inset:0;background:rgba(3,6,14,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.fin{width:min(620px,94vw);max-height:88vh;overflow:auto;border-radius:22px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.fin h2{margin:0 0 6px;font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:30px}
.fin p{margin:6px 0;font-size:14px;line-height:1.45}
.fin .pulsanti{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.campo{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:#fff;margin:5px 0}
.griglia{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.scheda{border:1px solid var(--bordo);background:rgba(255,255,255,.05);border-radius:14px;padding:12px;cursor:pointer;text-align:left;color:#fff}
.scheda:hover{border-color:var(--oro)}
.scheda h3{margin:0 0 6px;font-size:16px}
.scheda p{margin:0;font-size:12px;color:var(--muted)}
.ntabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.ntabs button{font-size:13px;padding:6px 10px}
.ntabs button.on{background:var(--setta);color:#160a2b;border-color:transparent}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:12px;z-index:70;font-size:14px;max-width:90%;background:rgba(10,16,26,.9);border:1px solid var(--bordo)}
.ingresso{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.ingresso .carta{width:min(480px,92vw);padding:28px;border-radius:24px;display:flex;flex-direction:column;gap:14px}
.posto{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
table.cl{width:100%;border-collapse:collapse;font-size:14px}table.cl td,table.cl th{padding:7px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}
.cartello{position:absolute;left:58%;top:22%;width:260px;border-radius:16px;overflow:hidden;animation:dondola 4s ease-in-out infinite}
@keyframes dondola{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(max-width:1100px){.decisione{width:calc(100vw - 32px);min-width:0;bottom:200px}.mappa{display:none}.tel{width:calc(100vw - 32px)}}

.gioco{position:absolute;inset:0;display:grid;grid-template-columns:270px minmax(0,1fr) 330px;gap:14px;padding:14px}
.colS,.colD{display:flex;flex-direction:column;gap:8px;min-height:0}
.colS .chip{border-radius:14px}
.cronaca{flex:1;min-height:0;overflow:auto;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rc{font-size:12px;line-height:1.35;color:rgba(255,255,255,.82);padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.rc.mia{color:#ffe3a6}
.centro{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;min-height:0}
.tavola{position:relative;width:min(100%,calc((100vh - 110px)*16/9));aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:#0b1018 url('img/mappa.jpg') center/cover;box-shadow:0 25px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.14);transition:filter .8s}
.tavola.notte{filter:brightness(.42) saturate(.7) hue-rotate(15deg)}
.notte-testo{position:absolute;inset:auto 0 18px 0;text-align:center;display:flex;flex-direction:column;filter:brightness(2.2)}
.notte-testo .serif{font-size:40px}
.cas{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.cas.ang{width:13px;height:13px;margin:-6.5px 0 0 -6.5px;background:var(--oro)}
.cas.pres{width:10px;height:10px;margin:-5px 0 0 -5px;box-shadow:0 0 0 2px #fff}
.tavola .ped{width:18px;height:18px;margin-top:-9px;display:flex;align-items:center;justify-content:center;transition:left .17s ease-out,top .17s ease-out;z-index:3}
.tavola .ped b{font-size:10px;color:#0b1018}
.tavola .ped.io{width:22px;height:22px;margin-top:-11px;z-index:4}
.ped.salto{animation:salto .18s ease-out}
@keyframes salto{50%{transform:translateY(-7px) scale(1.12)}}
.scia{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;transition:opacity .8s}
.scia.spegni{opacity:0}
.scia polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.scia polyline.oro{stroke:#ffd27a;stroke-width:.9;filter:drop-shadow(0 0 1.2px #ffb52e)}
.scia polyline.altro{stroke:rgba(255,255,255,.75);stroke-width:.5;stroke-dasharray:1 1}
.scia circle.oro{fill:#fff3d0}.scia circle.altro{fill:rgba(255,255,255,.8)}
.etichetta{position:absolute;transform:translate(-50%,calc(-100% - 18px));background:rgba(10,16,26,.82);border:1px solid rgba(243,197,107,.6);border-radius:10px;padding:5px 10px;font-size:12px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;z-index:5;pointer-events:none}
.etichetta span{color:var(--muted);font-size:11px}
.colD .saldo{width:auto}
.colD .decisione{position:static;transform:none;width:auto;min-width:0;left:auto;bottom:auto}
.gioco .tel{top:14px;bottom:14px;right:14px;width:360px;z-index:20}
.dadi-scena{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:60;pointer-events:none;background:radial-gradient(circle,rgba(3,6,14,.55),rgba(3,6,14,0) 60%);transition:opacity .35s}
.dadi-scena.via{opacity:0}
.dadi-scena .chi{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--oro)}
.coppia{display:flex;gap:46px;perspective:700px}
.cubo{position:relative;width:96px;height:96px;transform-style:preserve-3d}
.faccia{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#ece6d6);border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 -6px 12px rgba(0,0,0,.08)}
.faccia i{display:flex;align-items:center;justify-content:center}
.faccia i.pt::after{content:"";width:16px;height:16px;border-radius:50%;background:#1b1408;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.faccia.f{transform:translateZ(48px)}.faccia.b{transform:rotateY(180deg) translateZ(48px)}.faccia.r{transform:rotateY(90deg) translateZ(48px)}.faccia.l{transform:rotateY(-90deg) translateZ(48px)}.faccia.t{transform:rotateX(90deg) translateZ(48px)}.faccia.u{transform:rotateX(-90deg) translateZ(48px)}
.totale{font-family:'DM Serif Display',Georgia,serif;font-size:76px;line-height:1;color:#fff;text-shadow:0 4px 30px rgba(243,197,107,.8);opacity:0;transform:scale(.6);transition:all .3s}
.totale span{font-family:Manrope,sans-serif;font-size:20px;font-weight:800;color:var(--oro);vertical-align:middle}
.dadi-scena.fatto .totale{opacity:1;transform:scale(1)}
.dadi-scena.piccoli{background:none;justify-content:flex-start;padding-top:70px}
.dadi-scena.piccoli .cubo{width:56px;height:56px}.dadi-scena.piccoli .faccia{padding:8px;border-radius:10px}.dadi-scena.piccoli .faccia i.pt::after{width:9px;height:9px}
.dadi-scena.piccoli .faccia.f{transform:translateZ(28px)}.dadi-scena.piccoli .faccia.b{transform:rotateY(180deg) translateZ(28px)}.dadi-scena.piccoli .faccia.r{transform:rotateY(90deg) translateZ(28px)}.dadi-scena.piccoli .faccia.l{transform:rotateY(-90deg) translateZ(28px)}.dadi-scena.piccoli .faccia.t{transform:rotateX(90deg) translateZ(28px)}.dadi-scena.piccoli .faccia.u{transform:rotateX(-90deg) translateZ(28px)}
.dadi-scena.piccoli .coppia{gap:24px}.dadi-scena.piccoli .totale{font-size:40px}
.delta{position:fixed;right:60px;top:150px;font-family:'DM Serif Display',Georgia,serif;font-size:34px;z-index:65;animation:sale 2.6s ease-out forwards;text-shadow:0 2px 14px rgba(0,0,0,.6)}
@keyframes sale{0%{opacity:0;transform:translateY(20px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@media(max-width:1000px){.gioco{grid-template-columns:1fr;overflow:auto;align-content:start}.colS{flex-direction:row;overflow-x:auto;order:1}.colS .chip{flex-shrink:0}.cronaca{display:none}.centro{order:2}.tavola{width:100%}.colD{order:3}.gioco .tel{left:8px;right:8px;width:auto}}
@media(prefers-reduced-motion:reduce){.tavola .ped,.scia,.totale,.dadi-scena{transition:none}.ped.salto,.delta{animation:none}}
</style>

<body>
<div id="scena"></div><div id="ombra"></div>
<div id="radice"></div>
<script src="motore.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";
const SB_URL = "https://eqnrzboulnzkjuyhqsvu.supabase.co";
const SB_KEY = "sb_publishable_yTidV9j2WvfIA-VWrFVJQA_xUnfWX4_";
const sb = createClient(SB_URL, SB_KEY);
const db = sb.schema("laguna");
const L = window.Laguna;
const euro = L.euro;
const $ = (q) => document.querySelector(q);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL_SERIE = {Spezie:"#9b5a2c",Lanterne:"#ff8a3d",Sabbia:"#e9c46a",Corallo:"#14b8a6",Neon:"#ff4fa3",Velluto:"#b5179e",Acciaio:"#5c7f99",Vetro:"#2f6fe0",Oro:"#c9a24a",Platino:"#8d99ae",Moli:"#9aa"};
const SCENE = {Ambra:"img/ambra.jpg", Palma:"img/palma.jpg", Flamingo:"img/flamingo.jpg", Sole:"img/sole.jpg", Corona:"img/corona.jpg"};

let utente = null, partita = null, mioId = null, S = null, canale = null, telAperto = false, tab = "proprieta", saldoNascosto = false;
const visti = new Set();   // finestre gia' mostrate (alba, carte, notte)
let attesa = false;

function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 3600); }
function salvaLocale(){ try{ localStorage.setItem("laguna_online", JSON.stringify({partita, mioId})); }catch(e){} }
function leggiLocale(){ try{ return JSON.parse(localStorage.getItem("laguna_online")||"{}"); }catch(e){ return {}; } }
function scena(img){ $("#scena").style.backgroundImage = `url('${img}')`; }

// ------------------------------------------------------------ server
async function chiama(corpo){
  const { data, error } = await sb.functions.invoke("laguna", { body: corpo });
  if (error) {
    let msg = "Errore di collegamento.";
    try { const j = await error.context.json(); msg = j.errore || msg; if (error.context.status === 409) return { conflitto: true, errore: msg }; } catch(e){}
    return { errore: msg };
  }
  return data;
}
async function agisci(azione){
  if (attesa) return;
  attesa = true;
  let r = await chiama({ comando: "azione", partita, azione });
  if (r && r.conflitto) r = await chiama({ comando: "azione", partita, azione });
  attesa = false;
  if (r && r.errore) toast(r.errore);
  await caricaVista();
}
async function caricaVista(){
  const { data, error } = await db.from("viste").select("vista,versione").eq("partita_id", partita).eq("player_id", mioId).maybeSingle();
  if (error) { toast("Non riesco a leggere la partita: " + error.message); return; }
  if (data) riceviVista(data.vista);
}
function ascolta(){
  if (canale) sb.removeChannel(canale);
  canale = sb.channel("viste-" + partita)
    .on("postgres_changes", { event: "*", schema: "laguna", table: "viste", filter: "partita_id=eq." + partita }, (p) => {
      if (p.new && p.new.player_id === mioId && p.new.vista) riceviVista(p.new.vista);
    }).subscribe();
  // sicurezza: se il tempo reale si interrompe, ricarico ogni 8 secondi
  setInterval(() => { if (!document.hidden) caricaVista(); }, 8000);
}

// ------------------------------------------------------------ ingresso
async function avvio(){
  const { data: { session } } = await sb.auth.getSession();
  utente = session?.user || null;
  const loc = leggiLocale();
  if (!utente) return schermataNome();
  if (loc.partita && loc.mioId) {
    partita = loc.partita; mioId = loc.mioId;
    const { data } = await db.from("partite_pubbliche").select("*").eq("id", partita).maybeSingle();
    if (data && data.in_corso) { await caricaVista(); ascolta(); return; }
    if (data && !data.finita) return sala();
  }
  schermataCasa();
}
function schermataNome(){
  scena("img/laguna.jpg");
  $("#radice").innerHTML = `<div class="ingresso"><div class="carta vetro">
    <span class="kick" style="color:var(--oro)">Benvenuto nella Laguna</span>
    <span class="serif" style="font-size:52px;line-height:1">Re della Laguna</span>
    <div class="campo"><label for="nome">Come ti chiami?</label><input id="nome" maxlength="24" placeholder="Il tuo nome"></div>
    <button class="oro grande" id="entra">Entra</button>
    <span style="font-size:12px;color:var(--muted)">Niente email e niente password: ti ricordiamo su questo computer.</span></div></div>`;
  $("#entra").onclick = async () => {
    const nome = $("#nome").value.trim(); if (!nome) return toast("Scrivi il tuo nome.");
    const { data, error } = await sb.auth.signInAnonymously({ options: { data: { nome } } });
    if (error) return toast("Non riesco a farti entrare: " + error.message);
    utente = data.user; schermataCasa();
  };
}
function nomeMio(){ return utente?.user_metadata?.nome || "Giocatore"; }
function schermataCasa(){
  scena("img/laguna.jpg");
  const righe = [{tipo:"amico"},{tipo:"amico"},{tipo:"computer", strat:"Furbo"}];
  const STR = ["Legale","Costruttore","Investitore","Furbo","Spavaldo","Esperto"];
  const disegnaCasa = () => {
    $("#radice").innerHTML = `<div class="ingresso"><div class="carta vetro" style="width:min(560px,94vw)">
      <span class="kick" style="color:var(--oro)">Ciao ${esc(nomeMio())}</span>
      <span class="serif" style="font-size:44px;line-height:1">Re della Laguna</span>
      <div class="vetro" style="padding:14px;border-radius:16px;display:flex;flex-direction:column;gap:8px">
        <b>Crea una partita</b>
        <div class="posto"><div class="pall" style="background:var(--oro)">${esc(nomeMio()[0]||"T")}</div><span style="flex:1">${esc(nomeMio())} (tu)</span></div>
        ${righe.map((r,i)=>`<div class="posto"><div class="pall" style="background:${r.tipo==="amico"?"#4fc3f7":"#8a8a8a"}">${i+2}</div>
          <select data-i="${i}" class="tipo" style="flex:1"><option value="amico" ${r.tipo==="amico"?"selected":""}>Posto per un amico</option>${STR.map(s=>`<option value="${s}" ${r.tipo==="computer"&&r.strat===s?"selected":""}>Computer: ${s}</option>`).join("")}</select></div>`).join("")}
        <div class="riga"><button class="piccolo" id="piu">+ posto</button><button class="piccolo" id="meno">− posto</button></div>
        <label class="check"><input type="checkbox" id="princ" checked> Partita per principianti (le cose si sbloccano piano piano)</label>
        <button class="oro grande" id="crea">Crea la partita</button>
      </div>
      <div class="vetro" style="padding:14px;border-radius:16px;display:flex;flex-direction:column;gap:8px">
        <b>Hai un codice d'invito?</b>
        <div class="riga"><input id="codice" placeholder="es. PALMA-4821" style="flex:1;text-transform:uppercase"><button class="bianco" id="unisciti">Entra</button></div>
      </div></div></div>`;
    document.querySelectorAll(".tipo").forEach(s => s.onchange = () => { const r = righe[s.dataset.i]; if (s.value==="amico") { r.tipo="amico"; r.strat=null; } else { r.tipo="computer"; r.strat=s.value; } });

      const r = await chiama({ comando:"crea", giocatori, principianti: $("#princ").checked });

let principianti = true, timerSala = null;

// ------------------------------------------------------------ chi deve agire
function io(){ return S.players.find(p => p.id === mioId); }
function tocca(){
  if (!S || S.fine) return false;
  const me = io();
  if (S.fase === "pacchetti") return S.players[S.sceltaPacchetti[0]].id === mioId;
  if (S.pending && S.pending.tipo === "asta") return S.pending.partecipanti.includes(mioId) && typeof S.pending.offerte[mioId] !== "number";
  if (S.fase === "giorno") return L.corrente(S).id === mioId;
  if (S.fase === "notte") return !S.notteFatti[mioId] && me.faro === 0;
  return false;
}
function casellaDi(p){ return p.inner ? S.lotti.find(l=>l.giro==="i"&&l.idx===p.ipos) : S.lotti.find(l=>l.giro==="o"&&l.idx===p.pos); }

// posizioni sulla mini-mappa (in percentuale dell'immagine della laguna)
const ANG = [[54.7,73],[13.7,43.4],[44,23.4],[86,45]];   // Ponte Sud, Ovest, Nord, Est
const CTRL = [[22.5,69.4],[21.5,29.5],[76.2,26],[84,62.5]];          // Ambra, Palma, Flamingo, Sole
function puntoMappa(p){
  if (p.inner) { const a = (90 + p.ipos * 30) * Math.PI / 180; return [50 + 9 * Math.cos(a), 37.5 + 10.5 * Math.sin(a)]; }
  const lato = Math.floor(p.pos / 10), t = (p.pos % 10) / 10;
  const a = ANG[lato], b = ANG[(lato + 1) % 4], c = CTRL[lato];
  return [(1-t)*(1-t)*a[0] + 2*(1-t)*t*c[0] + t*t*b[0], (1-t)*(1-t)*a[1] + 2*(1-t)*t*c[1] + t*t*b[1]];
}

// ------------------------------------------------------------ animazioni (dadi, pedine, cronaca)
let disp = {};            // posizione mostrata di ogni pedina (puo' essere indietro rispetto allo stato vero)
let ultimoLog = null;     // ultima riga di cronaca gia' vista
let coda = [], animando = false;
const PRIVATI = /prestito|restituisce|investe|vende|ipoteca|riscatta/;   // operazioni che non mostriamo degli altri
const VELOCE = location.search.includes("veloce");   // ?veloce = senza animazioni (per le prove)
const pausa = (ms) => new Promise(r => setTimeout(r, ms));
function copiaPos(p){ return { inner: !!p.inner, pos: p.pos, ipos: p.ipos }; }
function nuoviLog(log){
  if (!ultimoLog) return [];
  const k = JSON.stringify(ultimoLog);
  for (let i = log.length - 1; i >= 0; i--) if (JSON.stringify(log[i]) === k) return log.slice(i + 1);
  return log.slice(-12);
}
let ultimaVistaJson = "";
function riceviVista(v){
  const j = JSON.stringify(v); if (j === ultimaVistaJson) return; ultimaVistaJson = j;
  if (!S) { S = v; S.players.forEach(p => disp[p.id] = copiaPos(p)); ultimoLog = S.log[S.log.length-1] || null; disegna(); return; }
  coda.push(v);
  if (!animando) eseguiCoda();
}
async function eseguiCoda(){
  animando = true;
  disegna();
  while (coda.length) {
    const v = coda.shift();
    const righe = nuoviLog(v.log);
    if (v.log.length) ultimoLog = v.log[v.log.length-1];
    const cashPrima = io() ? io().cash : 0;
    // prima i movimenti, in ordine, con i dadi
    const tiri = [];
    for (const r of righe) { const m = / tira (\d) e (\d)\.$/.exec(r.testo); if (m && r.chi) tiri.push({ chi: r.chi, d: [+m[1], +m[2]] }); }
    for (const r of righe) aggiungiCronaca(r);
    for (let i = 0; i < tiri.length; i++) {
      const t = tiri[i], mio = t.chi === mioId;
      await mostraDadi(t.d, mio, v.players.find(p=>p.id===t.chi));
      const ultimoDiQuesto = !tiri.slice(i+1).some(x => x.chi === t.chi);
      await cammina(t.chi, t.d[0] + t.d[1], ultimoDiQuesto ? v.players.find(p=>p.id===t.chi) : null, mio);
    }
    S = v;
    S.players.forEach(p => disp[p.id] = copiaPos(p));   // chi e' stato spostato da carte o dal Faro va al suo posto
    const me = io();
    if (me && me.cash !== cashPrima && cashPrima) mostraDelta(me.cash - cashPrima);
    for (const r of righe) avvisoPerMe(r);
    if (!coda.length) { animando = false; disegna(); }
  }
  animando = false;
}
function aggiungiCronaca(r){ /* la cronaca si ridisegna da S.log */ }
function avvisoPerMe(r){
  const me = io(); if (!me) return;
  if (/ tira \d e \d\.$/.test(r.testo)) return;
  const importante = /affitto|Stipendio|compra|Asta|Faro|Gazzetta|Posto di blocco|Casinò|ospite famoso/.test(r.testo);
  if (importante && (r.chi === mioId || r.testo.includes(" a " + me.nome + " ("))) toast(r.testo);
}
function mostraDelta(d){
  const el = document.createElement("div"); el.className = "delta"; el.textContent = (d > 0 ? "+ " : "− ") + euro(Math.abs(d));
  el.style.color = d > 0 ? "var(--pulito)" : "var(--sporco)";
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}
const FACCE = {1:[0,0],6:[0,180],3:[0,-90],4:[0,90],5:[-90,0],2:[90,0]};
const PUNTI = {1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function cubo(){ return `<div class="cubo">${[["f",1],["b",6],["r",3],["l",4],["t",5],["u",2]].map(([k,n])=>`<div class="faccia ${k}">${[1,2,3,4,5,6,7,8,9].map(i=>`<i class="${PUNTI[n].includes(i)?"pt":""}"></i>`).join("")}</div>`).join("")}</div>`; }
async function mostraDadi(d, mio, p){
  if (VELOCE) return;
  const lento = mio ? 1 : 0.55;
  const box = document.createElement("div"); box.className = "dadi-scena" + (mio ? "" : " piccoli");
  box.innerHTML = `<div class="chi">${mio ? "I tuoi dadi" : esc(p ? p.nome : "") + " tira i dadi"}</div><div class="coppia">${cubo()}${cubo()}</div><div class="totale">&nbsp;</div>`;
  document.body.appendChild(box);
  const cubi = box.querySelectorAll(".cubo");
  cubi.forEach((c, i) => { c.style.transition = "none"; c.style.transform = `rotateX(${Math.random()*360}deg) rotateY(${Math.random()*360}deg)`; });
  await pausa(30);
  cubi.forEach((c, i) => { const [x, y] = FACCE[d[i]]; const gx = 720 + 360 * (i+1), gy = 720 + 360 * (2-i);
    c.style.transition = `transform ${1.1*lento}s cubic-bezier(.2,.75,.25,1)`; c.style.transform = `rotateX(${x + gx}deg) rotateY(${y + gy}deg)`; });
  await pausa(1150 * lento);
  box.querySelector(".totale").innerHTML = `${d[0] + d[1]}${d[0]===d[1] ? ' <span>doppio!</span>' : ""}`;
  box.classList.add("fatto");
  await pausa(mio ? 900 : 450);
  box.classList.add("via"); setTimeout(() => box.remove(), 400);
}
function puntoDi(q){ return puntoMappa(q); }
async function cammina(id, n, finale, mio){
  if (VELOCE) return;
  const tav = document.querySelector(".tavola"); if (!tav) return;
  const ped = tav.querySelector(`.ped[data-id="${id}"]`); if (!ped) return;
  const q = { ...(disp[id] || { inner:false, pos:0, ipos:0 }) };
  const punti = [puntoDi(q)];
  const passo = mio ? 190 : 95;
  for (let k = 0; k < n; k++) {
    if (q.inner) q.ipos = (q.ipos + 1) % 12; else q.pos = (q.pos + 1) % 40;
    punti.push(puntoDi(q));
    disegnaScia(punti, mio);
    const [x, y] = punti[punti.length-1];
    ped.style.left = x + "%"; ped.style.top = y + "%";
    ped.classList.remove("salto"); void ped.offsetWidth; ped.classList.add("salto");
    await pausa(passo);
  }
  if (finale) { const [x, y] = puntoDi(finale); ped.style.left = x + "%"; ped.style.top = y + "%"; disp[id] = copiaPos(finale); }
  else disp[id] = q;
  await pausa(mio ? 500 : 150);
  const sv = tav.querySelector(".scia"); if (sv) sv.classList.add("spegni");
}
function disegnaScia(punti, mio){
  const sv = document.querySelector(".tavola .scia"); if (!sv) return;
  sv.classList.remove("spegni");
  sv.innerHTML = `<polyline points="${punti.map(([x,y])=>x+","+(y*0.5625)).join(" ")}" class="${mio?"oro":"altro"}"/>` +
    punti.map(([x,y])=>`<circle cx="${x}" cy="${y*0.5625}" r="${mio?0.9:0.6}" class="${mio?"oro":"altro"}"/>`).join("");
}

// ------------------------------------------------------------ disegno
function disegna(){
  if (!S) return;
  const me = io(); if (!me) return;
  const notte = S.fase === "notte";
  const c = casellaDi(me);
  scena(notte ? "img/marina.jpg" : me.faro ? "img/laguna.jpg" : S.fine ? "img/penthouse.jpg" : (c && c.isola ? (c.isola==="Flamingo" && S.pending && S.pending.tipo==="compra" ? "img/flamingo-lotto.jpg" : SCENE[c.isola]) : "img/laguna.jpg"));
  const turno = S.fase === "giorno" ? L.corrente(S) : null;

  const segn = ["Nessuno parla di te.","Voci: si parla di te, in giro.","Osservato: la polizia ti tiene d'occhio.","Indagato: la Gazzetta fa il tuo nome.","Processo: convocazione del Giudice all'Alba."][me.stato||0];
  const cron = S.log.filter(r => !/ tira \d e \d\.$/.test(r.testo) && !(r.chi && r.chi !== mioId && PRIVATI.test(r.testo))).slice(-9).reverse();
  const caselle = S.lotti.map(l => {
    const [x, y] = puntoMappa(l.giro === "i" ? { inner:true, ipos:l.idx } : { inner:false, pos:l.idx });

    return `<div class="cas ${l.tipoCasella==="angolo"?"ang":""} ${own?"pres":""}" title="${esc(tit)}" style="left:${x}%;top:${y}%;${own?"background:"+own.colore:""}"></div>`;
  }).join("");
  const gruppi = {};
  const pedine = S.players.map(p => {
    const q = disp[p.id] || copiaPos(p); const key = q.inner ? "i"+q.ipos : "o"+q.pos; const k = (gruppi[key] = (gruppi[key]||0) + 1) - 1;
    const [x, y] = puntoMappa(q);
    return `<div class="ped ${p.id===mioId?"io":""}" data-id="${p.id}" title="${esc(p.nome)}" style="left:${x}%;top:${y}%;margin-left:${-9 + k*7}px;background:${p.colore}${p.faro?";opacity:.45":""}"><b>${esc(p.nome[0])}</b></div>`;
  }).join("");
  const [mx, my] = puntoMappa(disp[mioId] || me);
  $("#radice").innerHTML = `
  <div class="gioco">
    <div class="colS">
      ${S.players.map(p=>`<div class="chip vetro ${turno&&turno.id===p.id?"turno":""}"><div class="pall" style="background:${p.colore}">${esc(p.nome[0])}</div><div><div class="n">${esc(p.nome)}${p.id===mioId?" (tu)":""}</div><div class="s">${p.id===mioId?esc(L.fascia(S,me)):esc(p.fascia||"")} · ${S.lotti.filter(l=>l.owner===p.id).length} propr.${p.faro?" · al Faro":""}${S.fase==="notte"?(S.notteFatti[p.id]?" · pronto":" · nella notte"):""}</div></div></div>`).join("")}
      <div class="cronaca vetro"><span class="kick" style="color:var(--muted)">Cronaca</span>${cron.map(r=>`<div class="rc ${r.chi===mioId?"mia":""}">${esc(r.testo)}</div>`).join("")}</div>
    </div>
    <div class="centro">
      <div class="fase vetro">${faseTesto}</div>
      <div class="tavola ${notte?"notte":""}">
        ${caselle}
        <svg class="scia" viewBox="0 0 100 56.25" preserveAspectRatio="none"></svg>
        ${pedine}
        ${!notte && c && !animando ? `<div class="etichetta" style="left:${mx}%;top:${my}%"><b>${esc(c.nome)}</b>${c.isola?`<span>${esc(L.NOMI_ISOLE[c.isola])}</span>`:""}</div>` : ""}
        ${notte ? `<div class="notte-testo"><span class="serif">La Notte</span><span>Tutti giocano insieme, in segreto.</span></div>` : ""}
      </div>
    </div>
    <div class="colD">
      <div class="saldo vetro">
        <div class="riga"><span class="kick" style="color:var(--muted)">Saldo segreto</span><button class="piccolo" id="occhio" aria-label="${saldoNascosto?"Mostra":"Nascondi"} il saldo" style="padding:3px 8px">${saldoNascosto?"Mostra":"Nascondi"}</button></div>
        <div class="riga"><span class="serif" style="font-size:30px;color:var(--pulito)">${saldoNascosto?"••••••":euro(me.cash)}</span></div>
        <div class="riga" style="font-size:13px"><span style="color:var(--sporco)">Sporchi ${saldoNascosto?"•••":euro(me.sporchi)}</span><span style="color:var(--oro)">Fama ${Math.round(me.fama)}</span></div>
        <div style="font-size:12px;color:${(me.stato||0)>=2?"#ffb3b3":"var(--muted)"}">${segn}</div>
      </div>
      <div class="decisione vetro">${animando ? `<div class="sub">…</div>` : pannelloDecisione(me)}</div>
      <div class="riga"><button class="vetro" id="bTel" style="flex:1">${telAperto?"Chiudi il telefono":"Telefono"}</button><button class="vetro piccolo" id="bAiuto">? Regole</button></div>
    </div>
    ${telAperto ? `<div class="tel vetro">${telefono(me)}</div>` : ""}
  </div>`;
  $("#occhio").onclick = () => { saldoNascosto = !saldoNascosto; disegna(); };
  $("#bTel").onclick = () => { telAperto = !telAperto; disegna(); };
  $("#bAiuto").onclick = aiuto;
  if (animando) return;
  collegaDecisione(me);
  if (telAperto) collegaTelefono(me);
  if (S.fine) return fine();
  finestreAutomatiche(me);
}

function pannelloDecisione(me){
  if (S.fine) return `<div class="titolo">La partita è finita</div>`;
  if (S.fase === "pacchetti") return tocca() ? `<div class="titolo">Scegli il tuo pacchetto di partenza</div><div class="sub">Sceglie per primo chi gioca per ultimo.</div><button class="oro grande" data-a="pacchetti">Vedi i pacchetti</button>` : `<div class="titolo">Gli altri scelgono il pacchetto</div><div class="sub">Tocca a ${esc(S.players[S.sceltaPacchetti[0]].nome)}.</div>`;
  if (S.pending && S.pending.tipo === "asta") {
    const l = S.lotti.find(x=>x.id===S.pending.lotto);
    return tocca() ? `<div class="titolo">Asta: ${esc(l.nome)}</div><div class="sub">Offerte segrete: vince la più alta.</div><button class="oro grande" data-a="asta">Fai la tua offerta</button>` : `<div class="titolo">Asta in corso: ${esc(l.nome)}</div><div class="sub">Aspetta le offerte degli altri.</div>`;
  }
  if (S.fase === "notte") {
    if (me.faro) return `<div class="titolo">Notte al Faro</div><div class="sub">Sei in prigione: stanotte non puoi muoverti.</div>`;
    if (S.notteFatti[mioId]) return `<div class="titolo">Hai finito la notte</div><div class="sub">Aspetta gli altri. All'Alba si fanno i conti.</div>`;
    return `<div class="riga" style="justify-content:space-between"><div><div class="titolo">La notte è tua</div><div class="sub">Affari stanotte: ${(me.affariStanotte||[]).length} su 2</div></div><button class="oro grande" data-a="notte">Apri la notte</button></div><button class="bianco" data-a="pronto">Pronto per l'Alba</button>`;
  }
  const turno = L.corrente(S);
  if (turno.id !== mioId) return `<div class="titolo">Turno di ${esc(turno.nome)}</div><div class="sub">Intanto puoi usare il telefono: Borsa, Banca, Contratti, Gazzetta.</div>`;
  if (S.pending && S.pending.giocatore === mioId) return `<div class="titolo">Hai una scelta da fare</div><button class="oro grande" data-a="pending">Decidi</button>`;
  const dadi = me.dadi ? `<span class="dado">${me.dadi[0]}</span><span class="dado">${me.dadi[1]}</span>` : "";
  if (!me.haTirato) return `<div class="riga" style="justify-content:space-between"><div><div class="titolo">Tocca a te</div><div class="sub">Tira i dadi: il percorso si accende fino alla casella.</div></div><button class="oro grande" data-a="tira">Tira i dadi</button></div>`;
  if (me.faro) return `<div class="titolo">Sei al Faro</div><div class="sub">Hai una telefonata: puoi usare il telefono una volta.</div><button class="oro" data-a="fine">Fine turno</button>`;
  return `<div class="riga">${dadi}<div style="flex:1"><div class="titolo">${esc(casellaDi(me)?.nome||"")}</div><div class="sub">${me.azioneGiornoFatta?"Azione del giorno fatta.":"Puoi fare una Azione del giorno."}</div></div></div>
    ${me.azioneGiornoFatta?"":`<div class="riga"><button data-a="costruisci">Costruisci</button><button data-a="palazzo">Piano del Palazzo</button><button data-a="veicolo">Mezzo di lusso</button><button data-a="prestito">Prestito</button></div>`}
    <button class="oro" data-a="fine">Fine turno</button>`;
}
function collegaDecisione(me){
  const on = (a, f) => document.querySelectorAll(`.decisione [data-a="${a}"]`).forEach(b => b.onclick = f);
  on("tira", () => agisci({tipo:"tira"}));
  on("fine", () => agisci({tipo:"fine_turno"}));
  on("pronto", () => agisci({tipo:"pronto"}));
  on("notte", () => finestraNotte(me));
  on("pacchetti", () => finestraPacchetti());
  on("asta", () => finestraAsta(me));
  on("pending", () => finestraPending(me));
  on("costruisci", () => finestraCostruisci(me));
  on("palazzo", () => finestraPalazzo(me));
  on("veicolo", () => finestraVeicolo());
  on("prestito", () => finestraPrestito(me));
}
function finestreAutomatiche(me){
  if (document.querySelector(".velo")) return;
  if (S.fase === "pacchetti" && tocca() && !visti.has("pk")) { visti.add("pk"); return finestraPacchetti(); }
  if (S.pending && S.pending.tipo === "asta" && tocca() && !visti.has("asta"+S.pending.lotto+S.ciclo+S.giorno)) { visti.add("asta"+S.pending.lotto+S.ciclo+S.giorno); return finestraAsta(me); }
  if (S.pending && S.pending.giocatore === mioId && S.pending.tipo !== "asta") { const k = "p"+S.pending.tipo+(S.pending.lotto||"")+S.ciclo+S.giorno; if (!visti.has(k)) { visti.add(k); return finestraPending(me); } }
  if (S.ultimaAlba && S.fase === "giorno" && !visti.has("alba"+S.ultimaAlba.ciclo)) { visti.add("alba"+S.ultimaAlba.ciclo); return finestraAlba(me); }
  if (S.ultimaCarta && S.ultimaCarta.giocatore === mioId) { const k = "carta"+S.ultimaCarta.testo+S.ciclo+S.giorno; if (!visti.has(k)) { visti.add(k); return finestra(`<span class="kick" style="color:var(--oro)">Gazzetta</span><h2>${esc(S.ultimaCarta.testo)}</h2><div class="pulsanti"><button class="oro" id="ok">Ok</button></div>`, (d,c)=>d.querySelector("#ok").onclick=c); } }
  if (me.ultimaSentenza && !visti.has("sent"+JSON.stringify(me.ultimaSentenza))) { visti.add("sent"+JSON.stringify(me.ultimaSentenza)); const s=me.ultimaSentenza; return finestra(`<span class="kick" style="color:var(--sporco)">Sentenza · ${esc(s.gravita)}</span><h2>Il Giudice ha deciso</h2><p>Soldi sporchi confiscati: <b>${euro(s.confiscati)}</b><br>Multa: <b>${euro(s.multa)}</b>${s.faro?`<br>Faro: <b>${s.faro} turni</b>`:""}${s.blocco?`<br>Entrate bloccate per <b>${s.blocco} Cicli</b>`:""}</p><div class="pulsanti"><button class="oro" id="ok">Ho capito</button></div>`, (d,c)=>d.querySelector("#ok").onclick=c); }
  if (S.fase === "notte" && tocca() && !visti.has("notte"+S.ciclo)) { visti.add("notte"+S.ciclo); return finestraNotte(me); }
}

const TABS = [["proprieta","Proprietà"],["banca","Banca"],["borsa","Borsa"],["contratti","Contratti"],["setta","Setta"],["gazzetta","Gazzetta"],["messaggi","Messaggi"]];

}

      ${l.ipoteca?`<br><span class="tag voce">Ipotecato</span> <button class="piccolo" data-riscatta="${l.id}">Riscatta</button>`:`<br><button class="piccolo" data-ipoteca="${l.id}">Ipoteca (${euro(0.5*L.valoreLotto(l))})</button>`}

      <div class="it">Evasione delle tasse: <select id="evasione">${[0,0.1,0.2,0.3].map(q=>`<option value="${q}" ${Math.abs(q-(me.evasione||0))<0.01?"selected":""}>${q*100}%${q?" (diventa sporco, lascia Tracce)":""}</option>`).join("")}</select></div>

      ${me.prove&&me.prove.length?`<div class="it"><b>Le tue Prove</b>${me.prove.map((pr,i)=>`<div>Foto di ${esc(S.players.find(x=>x.id===pr.su).nome)} (${esc(pr.cosa)}) <button class="piccolo" data-denuncia="${i}">Denuncia</button></div>`).join("")}</div>`:""}
      ${S.sindaco===mioId?`<div class="it"><b>Sei il Sindaco.</b><div class="riga" style="margin-top:6px"><select id="leggeSel">${Object.entries(L.LEGGI).map(([k,x])=>`<option value="${k}">${esc(x.nome)}</option>`).join("")}</select><select id="leggeIsola">${L.ISOLE.map(i=>`<option value="${i}">${L.NOMI_ISOLE[i]}</option>`).join("")}</select><button class="piccolo" data-a="legge">Firma</button></div><div class="riga" style="margin-top:6px">Tasse <select id="tasseSel">${[0.1,0.15,0.2,0.25,0.3].map(q=>`<option value="${q}" ${Math.abs(q-S.tassa)<0.01?"selected":""}>${q*100}%</option>`).join("")}</select><button class="piccolo" data-a="tasse">Cambia</button></div></div>`:""}
      ${S.candidati[mioId]!==undefined?`<div class="it">Sei candidato Sindaco. Campagna: <input id="campImp" type="number" style="width:120px"> <button class="piccolo" data-a="campagna">Investi</button></div>`:""}`;
  }
  if (tab === "borsa") {
    return `${L.AZIENDE.map(a=>`<div class="it"><b>${a}</b> ${S.borsa[a].toFixed(1)} · tue: ${euro((me.azioni[a]||0)*S.borsa[a])}

  }
  if (tab === "setta") {
    return `${(S.inviti||[]).map(x=>`<div class="it">Invito segreto da una setta <button class="piccolo" data-invito="${x.setta}|1">Entra</button> <button class="piccolo" data-invito="${x.setta}|0">Rifiuta</button></div>`).join("")}
      ${S.sette.length?S.sette.map(st=>`<div class="it"><b style="color:var(--setta)">${esc(st.nome)}</b> — livello ${L.livelloSetta(S, st)}<br><i>${esc(st.motto)}</i><br>

  }
  if (tab === "contratti") {
    const miei = S.contratti.filter(k=>k.da===mioId||k.a===mioId);

      ${esc(S.players.find(x=>x.id===k.da).nome)} ↔ ${esc(S.players.find(x=>x.id===k.a).nome)}: subito ${euro(k.pagoOra)}, alla fine del Ciclo ${k.scadenza+1}: ${euro(k.pagoDopo)}
      ${k.testo?`<br><i>"${esc(k.testo)}"</i>`:""}
      ${k.a===mioId&&k.stato==="proposto"?`<br><button class="piccolo" data-contr="${k.id}|1">Accetta</button> <button class="piccolo" data-contr="${k.id}|0">Rifiuta</button>`:""}</div>`).join("")||"<p>Nessun contratto.</p>"}
      <button class="piccolo" data-a="nuovoContratto">Proponi un contratto</button>`;

  if (tab === "messaggi") return [...(me.messaggi||[])].reverse().map(m=>`<div class="it"><span class="tag">C${m.ciclo}</span>${esc(m.testo)}</div>`).join("")||"<p>Nessun messaggio.</p>";
  return "";

function collegaTelefono(me){

  const on = (sel, f) => document.querySelectorAll(".tel " + sel).forEach(b => b.onclick = () => f(b));
  on('[data-a="restituisci"]', () => agisci({tipo:"restituisci", importo: me.debito}));

  on('[data-a="legge"]', () => agisci({tipo:"legge", legge: $("#leggeSel").value, isola: $("#leggeIsola").value}));

  on('[data-a="nuovoContratto"]', () => finestraContratto());
  if ($("#evasione")) $("#evasione").onchange = (e) => agisci({tipo:"evasione", quota:Number(e.target.value)});
  on("[data-ipoteca]", b => agisci({tipo:"ipoteca", lotto:b.dataset.ipoteca}));
  on("[data-riscatta]", b => agisci({tipo:"riscatta", lotto:b.dataset.riscatta}));
  on("[data-denuncia]", b => agisci({tipo:"denuncia", prova:Number(b.dataset.denuncia)}));
  on("[data-compra]", b => { const [cosa, nome] = b.dataset.compra.split("|"); const imp = document.querySelector(`[data-imp="${cosa==="borsa"?"b":"c"}_${nome}"]`).value; agisci({tipo:"investi", cosa, nome, importo:Number(imp)}); });
  on("[data-vendi]", b => { const [cosa, nome] = b.dataset.vendi.split("|"); agisci({tipo:"vendi", cosa, nome, quota:1}); });
  on("[data-invito]", b => { const [st, si] = b.dataset.invito.split("|"); agisci({tipo:"rispondi_invito", setta:st, si: si==="1"}); });
  on("[data-versa]", b => { const [st, sp] = b.dataset.versa.split("|"); agisci({tipo:"versa_setta", setta:st, importo:Number($("#versa_"+st).value), sporchi: sp==="1"}); });
  on("[data-invita]", b => agisci({tipo:"invita_setta", setta:b.dataset.invita, invitato: $("#inv_"+b.dataset.invita).value}));
  on("[data-contr]", b => { const [k, si] = b.dataset.contr.split("|"); agisci({tipo:"rispondi_contratto", id:k, si: si==="1"}); });
}

function finestra(html, collega){
  const d = document.createElement("div"); d.className = "velo"; d.innerHTML = `<div class="fin vetro">${html}</div>`;
  document.body.appendChild(d);
  const chiudi = () => d.remove();
  collega && collega(d, chiudi);
  return chiudi;
}
function extraTesto(e){
  const t = [];
  if (e.cash) t.push("+" + euro(e.cash)); if (e.piani) t.push("Palazzo con " + e.piani + " piani"); if (e.azioni) t.push(euro(e.azioni) + " in azioni");
  if (e.veicolo) t.push("un motoscafo"); if (e.fama) t.push("fama " + e.fama); if (e.reputazione) t.push("contatti nel giro"); if (e.cripto) t.push(euro(e.cripto) + " in FlamingoToken");
  return t.join(" · ");
}

      const next = l.lvl+1, costo = next<=5 ? L.N.costLvl[next]*l.prezzo : 0;
      return `<div class="it"><b>${esc(l.nome)}</b> — ${l.tipo?esc(L.ATTIVITA[l.tipo].nome)+" livello "+l.lvl:"vuoto"} ${L.haSerie(S, me, l.serie)?'<span class="tag fama">serie completa</span>':""}
      <div class="riga" style="margin-top:6px">${l.lvl<5?`${l.lvl===0?`<select id="t_${l.id}">${ok.map(([k,t])=>`<option value="${k}">${esc(t.nome)}</option>`).join("")}</select>`:""}${next>=3&&!L.haSerie(S, me, l.serie)?`<span style="color:var(--muted)">Livello ${next}: serve la serie completa</span>`:`<button class="piccolo oro" data-cost="${l.id}" ${me.cash<costo?"disabled":""}>Livello ${next} — ${euro(costo)}</button>`}`:"Livello massimo"}</div></div>`;}).join("")}
    <div class="pulsanti"><button id="x">Chiudi</button></div>`, (d, c) => {
    d.querySelector("#x").onclick = c;
    d.querySelectorAll("[data-cost]").forEach(b => b.onclick = () => { const sel = d.querySelector("#t_"+b.dataset.cost); c(); agisci({tipo:"costruisci", lotto:b.dataset.cost, attivita: sel?sel.value:undefined}); });
  });
}
function finestraPalazzo(me){
  const F = {appartamenti:"Appartamenti (rendita)",uffici:"Uffici (rendita)",ristorante_panoramico:"Ristorante panoramico",spa:"Spa e piscina",casino_privato:"Casinò privato (serve licenza)",caveau:"Caveau (protegge 5 milioni di sporchi)",sala_insonorizzata:"Sala insonorizzata",garage:"Garage di lusso",eliporto:"Eliporto",piani_segreti:"Piani segreti (sede della setta)"};
  const costo = Math.round(L.N.pianoCost * Math.pow(L.N.pianoGrow, me.piani));
  finestra(`<span class="kick" style="color:var(--oro)">Azione del giorno</span><h2>Il tuo Palazzo</h2><p>Hai ${me.piani} piani. Il prossimo costa <b>${euro(costo)}</b>${me.piani===0&&me.pacchetto!=="costruttore"?" più il permesso (300.000 €)":""}.</p>
    <div class="campo"><label for="f">Funzione del nuovo piano</label><select id="f">${Object.entries(F).map(([k,t])=>`<option value="${k}">${t}</option>`).join("")}</select></div>
    <div class="pulsanti"><button id="x">Chiudi</button><button class="oro" id="ok">Costruisci il piano</button></div>`, (d, c) => {
    d.querySelector("#x").onclick = c; d.querySelector("#ok").onclick = () => { c(); agisci({tipo:"piano", funzione:d.querySelector("#f").value}); };
  });
}
function finestraVeicolo(){
  finestra(`<span class="kick" style="color:var(--oro)">Marina dei Re</span><h2>Mezzi di lusso</h2><div class="griglia">${Object.entries(L.N.veicoli).map(([k,v])=>`<button class="scheda" data-v="${k}"><h3>${v.nome}</h3><p>${euro(v.prezzo)}<br>rende ${euro(v.prezzo*v.rend)}/Ciclo · +${v.fama} fama</p></button>`).join("")}</div>
    <div class="pulsanti"><button id="x">Chiudi</button></div>`, (d, c) => {
    d.querySelector("#x").onclick = c; d.querySelectorAll("[data-v]").forEach(el => el.onclick = () => { c(); agisci({tipo:"veicolo", veicolo:el.dataset.v}); });
  });
}
function finestraPrestito(me){
  const cap = Math.max(0, L.N.prestitoQuota * S.lotti.filter(l=>l.owner===mioId && l.serie!=="Moli").reduce((a,l)=>a+L.valoreLotto(l),0) - me.debito);
  finestra(`<span class="kick" style="color:var(--pulito)">Banca Centrale</span><h2>Chiedi un prestito</h2><p>Puoi chiedere fino a <b>${euro(cap)}</b>. Interesse 10% a Ciclo, da restituire entro 3 Cicli.</p>
    <div class="campo"><label for="imp">Quanto</label><input id="imp" type="number" value="${Math.round(cap/2)}"></div>
    <div class="pulsanti"><button id="x">Chiudi</button><button class="oro" id="ok">Chiedi</button></div>`, (d, c) => {
    d.querySelector("#x").onclick = c; d.querySelector("#ok").onclick = () => { c(); agisci({tipo:"prestito", importo:Number(d.querySelector("#imp").value)}); };
  });
}
function finestraContratto(){
  const altri = S.players.filter(x=>x.id!==mioId);
  const lotti = S.lotti.filter(l=>l.owner&&l.tipoCasella!=="angolo");
  finestra(`<span class="kick" style="color:var(--setta)">Contratti</span><h2>Proponi un contratto</h2>
    <div class="campo"><label for="a">Con chi</label><select id="a">${altri.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></div>
    <div class="campo"><label for="tipo">Tipo</label><select id="tipo"><option value="notarile">Notarile (lo fa rispettare il gioco, costa il 2%)</option><option value="parola">Sulla parola (nessuno lo fa rispettare)</option></select></div>
    <div class="campo"><label>Pagamento subito</label><div class="riga"><input id="ora" type="number" value="0" style="width:140px"> pagato da <select id="chiOra"><option value="da">me</option><option value="a">lui/lei</option></select></div></div>
    <div class="campo"><label>Pagamento alla scadenza</label><div class="riga"><input id="dopo" type="number" value="0" style="width:140px"> pagato da <select id="chiDopo"><option value="a">lui/lei</option><option value="da">me</option></select> fra <select id="cicli">${[1,2,3,4].map(n=>`<option>${n}</option>`).join("")}</select> Cicli</div></div>
    <div class="campo"><label for="lotto">Lotto da scambiare subito (facoltativo)</label><select id="lotto"><option value="">nessuno</option>${lotti.map(l=>`<option value="${l.id}">${esc(l.nome)} (${esc(S.players.find(x=>x.id===l.owner).nome)})</option>`).join("")}</select></div>
    <div class="campo"><label for="gar">Garanzia: se chi deve pagare non paga, questo lotto passa all'altro (solo notarile)</label><select id="gar"><option value="">nessuna</option>${lotti.map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join("")}</select></div>
    <div class="campo"><label for="testo">Il resto dei patti, con parole tue</label><textarea id="testo" rows="3"></textarea></div>
    <div class="pulsanti"><button id="x">Annulla</button><button class="oro" id="ok">Proponi</button></div>`, (d, c) => {
    d.querySelector("#x").onclick = c;
    d.querySelector("#ok").onclick = () => { const g = (q)=>d.querySelector(q).value; c(); agisci({tipo:"contratto", contratto:{a:g("#a"), tipo:g("#tipo"), pagoOra:Number(g("#ora")), chiPagaOra:g("#chiOra"), pagoDopo:Number(g("#dopo")), chiPagaDopo:g("#chiDopo"), cicli:Number(g("#cicli")), lottoCeduto:g("#lotto")||null, garanzia:g("#gar")||null, testo:g("#testo")}}); };
  });
}
function finestraNotte(me){
  if (document.querySelector(".velo")) return;
  if (me.faro > 0) return finestra(`<h2>Notte al Faro</h2><p>Sei in prigione. Stanotte non puoi muoverti.</p><div class="pulsanti"><button class="oro" id="ok">Ok</button></div>`, (d,c)=>d.querySelector("#ok").onclick=c);
  const altri = S.players.filter(x=>x.id!==mioId);
  const gm = S.sette.filter(st=>st.gm===mioId);
  const ISO = L.ISOLE.map(i=>`<option value="${i}">${L.NOMI_ISOLE[i]}</option>`).join("");
  const fatti = (me.affariStanotte||[]).length;
  finestra(`<span class="kick" style="color:#9ecbff">Notte · Ciclo ${S.ciclo+1}</span><h2>La notte è tua</h2>
    <p>Puliti <b style="color:var(--pulito)">${euro(me.cash)}</b> · Sporchi <b style="color:var(--sporco)">${euro(me.sporchi)}</b> · Affari stanotte: ${fatti} su 2</p>
    <div class="ntabs">${["Affari","Corrompi","Ripulisci","Spia","Setta","Gazzetta"].map((t,i)=>`<button class="${i===0?"on":""}" data-n="${i}">${t}</button>`).join("")}</div>
    <div data-p="0">
      <div class="campo"><label for="aff">Affare</label><select id="aff">${Object.entries(L.AFFARI).map(([k,a])=>`<option value="${k}">${a.nome} — ${a.descr}</option>`).join("")}</select></div>
      <div class="campo"><label for="int">Intensità</label><select id="int"><option value="prudente">Prudente (guadagno x1, poche tracce)</option><option value="normale" selected>Normale (x1,4)</option><option value="spavaldo">Spavaldo (x2, tantissime tracce)</option></select></div>
      <div class="campo"><label>Le mosse giuste</label>${Object.entries(L.N.mosse).map(([k,m])=>`<label class="check"><input type="checkbox" value="${k}" class="mossa"> ${m.nome}${m.costo?" ("+euro(m.costo)+")":""}</label>`).join("")}</div>
      <button class="oro" id="faiAff" ${fatti>=2?"disabled":""}>Fai l'affare</button>
    </div>
    <div data-p="1" style="display:none">
      <p>Comprare qualcuno abbassa il rischio, ma lascia Tracce e costa ogni Ciclo. Può anche rifiutare e fare il tuo nome.</p>
      <div class="campo"><label for="chi">Chi</label><select id="chi"><option value="agente">Agente di quartiere (${euro(L.N.corruz.agente[0])}, poi ${euro(L.N.corruz.agente[1])}/Ciclo)</option><option value="commissario">Commissario Vargas (${euro(L.N.corruz.commissario[0])})</option><option value="banchiere">Banchiere Lenz (${euro(L.N.corruz.banchiere[0])})</option></select></div>
      <div class="campo"><label for="isoCorr">Isola (per l'agente)</label><select id="isoCorr">${ISO}</select></div>
      <label class="check"><input type="checkbox" id="corrSp"> Paga in soldi sporchi (20% in meno)</label>
      <button class="oro" id="faiCorr">Fai l'offerta</button>
    </div>
    <div data-p="2" style="display:none">
      <p>Copertura disponibile: <b>${euro(L.copertura(S, me) - (me.copUsata||0))}</b> (perdi il 15%). ShadowCoin: senza limite, perdi il 25%. Paradiso fiscale: serve il jet, perdi il 30%.</p>
      <div class="campo"><label for="met">Metodo</label><select id="met"><option value="copertura">Le tue attività di copertura</option><option value="shadow">ShadowCoin</option><option value="paradiso">Paradiso fiscale (jet)</option></select></div>
      <div class="campo"><label for="ricImp">Quanto</label><input id="ricImp" type="number" value="${Math.round(me.sporchi)}"></div>
      <button class="oro" id="faiRic">Ripulisci</button>
    </div>
    <div data-p="3" style="display:none">
      <p>Segui un rivale con la macchina fotografica. Se stanotte fa affari illegali, hai il 50% di ottenere una Prova.</p>
      <div class="campo"><label for="spi">Chi segui</label><select id="spi">${altri.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></div>
      <button class="oro" id="faiSpia">Seguilo</button>
    </div>
    <div data-p="4" style="display:none">
      ${S.sette.length?"":`<p>Fonda una setta: serve un patrimonio di ${euro(L.N.settaPatrimonio)} e fama 20.</p>
      <div class="campo"><label for="sNome">Nome</label><input id="sNome"></div><div class="campo"><label for="sMotto">Motto</label><input id="sMotto"></div><button class="oro" id="fonda">Fonda la setta</button>`}
      ${gm.map(st=>`<div class="it"><b style="color:var(--setta)">${esc(st.nome)}</b> — livello ${L.livelloSetta(S, st)} · Tesoro ${euro(st.tesoro)}
        <div class="campo"><label>Operazione</label><select id="op_${st.id}"><option value="manipola">Manipolare un titolo (liv. 2, 1 milione)</option><option value="blackout">Blackout di un'isola (liv. 3, 3 milioni)</option><option value="evasione">Far evadere qualcuno dal Faro (liv. 3, 2 milioni)</option><option value="fantoccio">Sindaco fantoccio (liv. 4, 10 milioni)</option></select></div>
        <div class="riga"><select id="ob_${st.id}">${L.AZIENDE.map(a=>`<option value="${a}">${a}</option>`).join("")}${L.ISOLE.map(i=>`<option value="${i}">${L.NOMI_ISOLE[i]}</option>`).join("")}${S.players.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select><select id="od_${st.id}"><option value="su">su</option><option value="giu">giù</option></select><button class="piccolo oro" data-op="${st.id}">Lancia</button></div>
        <div class="riga" style="margin-top:8px"><select id="rc_${st.id}"><option value="banchiere">Recluta il Banchiere (2,5 milioni)</option><option value="commissario">Recluta il Commissario (3 milioni)</option><option value="giudice">Recluta il Giudice (3,5 milioni)</option></select><button class="piccolo" data-rec="${st.id}">Recluta</button></div></div>`).join("")}
    </div>
    <div data-p="5" style="display:none">
      <p>Compra un articolo sulla Gazzetta del mattino. Uno scandalo su chi non ha niente da nascondere può ritorcersi contro di te.</p>
      <div class="campo"><label for="art">Su chi</label><select id="art">${S.players.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></div>
      <div class="campo"><label for="ton">Tono</label><select id="ton"><option value="elogio">Elogio (+fama)</option><option value="scandalo">Scandalo (−fama)</option></select></div>
      <div class="campo"><label for="artImp">Quanto paghi (min. 125.000 €)</label><input id="artImp" type="number" value="250000"></div>
      <div class="campo"><label for="artTesto">Il titolo, con parole tue</label><input id="artTesto"></div>
      <label class="check"><input type="checkbox" id="artSp"> Paga in soldi sporchi</label>
      <button class="oro" id="faiArt">Pubblica</button>
    </div>
    <div class="pulsanti"><button id="chiudi">Chiudi</button><button class="bianco" id="pronto">Pronto per l'Alba</button></div>`, (d, c) => {
    const az = async (a) => { c(); await agisci(a); const nuovo = io(); if (S.fase === "notte" && nuovo) finestraNotte(nuovo); };
    d.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { d.querySelectorAll("[data-n]").forEach(x=>x.classList.remove("on")); b.classList.add("on"); d.querySelectorAll("[data-p]").forEach(x=>x.style.display = x.dataset.p===b.dataset.n?"block":"none"); });
    d.querySelector("#faiAff").onclick = () => az({tipo:"affare", affare:d.querySelector("#aff").value, intensita:d.querySelector("#int").value, mosse:[...d.querySelectorAll(".mossa:checked")].map(x=>x.value)});
    d.querySelector("#faiCorr").onclick = () => az({tipo:"corrompi", chi:d.querySelector("#chi").value, isola:d.querySelector("#isoCorr").value, sporchi:d.querySelector("#corrSp").checked});
    d.querySelector("#faiRic").onclick = () => az({tipo:"ricicla", metodo:d.querySelector("#met").value, importo:Number(d.querySelector("#ricImp").value)});
    d.querySelector("#faiSpia").onclick = () => az({tipo:"spia", bersaglio:d.querySelector("#spi").value});
    if (d.querySelector("#fonda")) d.querySelector("#fonda").onclick = () => az({tipo:"fonda_setta", nome:d.querySelector("#sNome").value, motto:d.querySelector("#sMotto").value});
    d.querySelectorAll("[data-op]").forEach(b => b.onclick = () => az({tipo:"operazione", setta:b.dataset.op, op:d.querySelector("#op_"+b.dataset.op).value, bersaglio:d.querySelector("#ob_"+b.dataset.op).value, direzione:d.querySelector("#od_"+b.dataset.op).value}));
    d.querySelectorAll("[data-rec]").forEach(b => b.onclick = () => az({tipo:"recluta", setta:b.dataset.rec, chi:d.querySelector("#rc_"+b.dataset.rec).value}));
    d.querySelector("#faiArt").onclick = () => az({tipo:"articolo", bersaglio:d.querySelector("#art").value, tono:d.querySelector("#ton").value, importo:Number(d.querySelector("#artImp").value), testo:d.querySelector("#artTesto").value, sporchi:d.querySelector("#artSp").checked});
    d.querySelector("#chiudi").onclick = c;
    d.querySelector("#pronto").onclick = () => { c(); agisci({tipo:"pronto"}); };
  });
}
function fine(){
  if (document.querySelector(".velo")) return;
  finestra(`<span class="kick" style="color:var(--oro)">Fine della serata</span><h2>La Rivelazione</h2>
    <table class="cl"><tr><th>#</th><th>Giocatore</th><th>Patrimonio</th><th>Fama</th></tr>${S.classifica.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.nome)}</td><td>${euro(c.patrimonio)}</td><td>${c.fama}</td></tr>`).join("")}</table>
    <p class="kick" style="color:var(--muted);margin-top:14px">I titoli</p>${S.titoli.map(t=>`<p><b>${esc(t.titolo)}:</b> ${esc(t.a)}</p>`).join("")}
    <p class="kick" style="color:var(--muted);margin-top:14px">Le sette</p>${S.rivelazione.length?S.rivelazione.map(r=>`<p><b style="color:var(--setta)">${esc(r.setta)}</b> — Gran Maestro ${esc(r.gm)}, membri: ${r.membri.map(esc).join(", ")}, tesoro ${euro(r.tesoro)}</p>`).join(""):"<p>Nessuna setta è nata in questa partita.</p>"}
    <div class="pulsanti"><button class="oro" id="nuova">Nuova partita</button></div>`, (d,c)=>d.querySelector("#nuova").onclick=()=>{ c(); try{localStorage.removeItem("laguna_online")}catch(e){}; S=null; partita=null; schermataCasa(); });
}
function aiuto(){
  finestra(`<h2>Come si gioca</h2>
    <p><b>Di giorno</b> tiri i dadi, ti muovi, compri o paghi l'affitto, poi fai una sola <b>Azione del giorno</b>. Borsa, Banca e Contratti li usi quando vuoi dal telefono.</p>
    <p><b>Di notte</b> tutti giocano insieme: affari illegali con le mosse giuste, corruzione, riciclo, spie, sette, articoli. Poi premi Pronto.</p>
    <p><b>All'Alba</b> arrivano rendite e tasse, si muovono Borsa e cripto, esce la Gazzetta e si fanno i processi. Dopo 6 Cicli vince il patrimonio più alto.</p>
    <p><b>La polizia</b> controlla 3 volte per Ciclo. Non vedi le tue Tracce: vedi solo i segnali sotto il saldo.</p>
    <div class="pulsanti"><button class="oro" id="ok">Ho capito</button></div>`, (d,c)=>d.querySelector("#ok").onclick=c);
}

for (const f of ["laguna","marina","penthouse","flamingo-lotto","mappa",...Object.values(SCENE).map(x=>x.slice(4,-4))]) { const i = new Image(); i.src = "img/" + f + ".jpg"; }
avvio();
</script>
